services:
  falkordb:
    # Pin a tested tag in Phase 0.1 (override with FALKORDB_IMAGE).
    image: ${FALKORDB_IMAGE:-falkordb/falkordb:latest}
    ports:
      - "6379:6379"   # Redis protocol
      - "3000:3000"   # FalkorDB Browser
    volumes:
      - falkordb-data:/var/lib/falkordb/data

volumes:
  falkordb-data:
