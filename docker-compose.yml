services:
  falkordb:
    # Pinned in Phase 0.1 (override with FALKORDB_IMAGE). 6.0.2 is untested; see docs/SPIKES.md.
    image: ${FALKORDB_IMAGE:-falkordb/falkordb:v4.22.1}
    ports:
      - "6379:6379"   # Redis protocol
      - "3000:3000"   # FalkorDB Browser
    volumes:
      - falkordb-data:/var/lib/falkordb/data

volumes:
  falkordb-data:
